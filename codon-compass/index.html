<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Same-origin for everything except the two optional structure hosts, which are attempted and
       degrade cleanly if a network or proxy blocks them. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https://alphafold.ebi.ac.uk https://files.rcsb.org https://myvariant.info https://grch38.genomenexus.org https://gnomad.broadinstitute.org https://rest.ensembl.org https://eutils.ncbi.nlm.nih.gov https://spliceai-38-xwkwwwxdwq-uc.a.run.app https://spliceailookup-api.broadinstitute.org https://myvariant.info" />
  <title>Codon Compass</title>
  <link rel="stylesheet" href="renderer/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">Codon Compass</span>
      <span class="tag">Variant assessment portal</span>
    </div>
    <span class="spacer"></span>
    <span class="pill" id="genebe-pill" title="GeneBe annotation is available only in the desktop app." style="cursor:pointer">Assessment: —</span>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="assess" class="active">Assess a variant</button>
    <button data-view="context">Gene context</button>
    <button data-view="gnomad">gnomAD</button>
    <button data-view="splice">Splice</button>
    <button data-view="genebe">GeneBe</button>
    <button data-view="assessment">Variant evidence</button>
    <button data-view="fusions">Fusions</button>
    <button data-view="board">Lollipop board</button>
    <button data-view="amino">Amino acids</button>
    <button data-view="codon">Codon table</button>
    <button data-view="tools">Sequence tools</button>
    <button data-view="about">Sources</button>
  </nav>

  <main>
    <section id="view-assess" class="view active"></section>
    <section id="view-context" class="view"></section>
    <section id="view-gnomad" class="view"></section>
    <section id="view-splice" class="view"></section>
    <section id="view-genebe" class="view"></section>
    <section id="view-assessment" class="view"></section>
    <section id="view-fusions" class="view"></section>
    <section id="view-board" class="view"></section>
    <section id="view-amino" class="view"></section>
    <section id="view-codon" class="view"></section>
    <section id="view-tools" class="view"></section>
    <section id="view-about" class="view"></section>
  </main>

  <script src="renderer/vendor/3Dmol-min.js"></script>
  <!-- The browser bridge must define window.api before the shared renderer runs. -->
  <script type="module" src="web/api.mjs"></script>
  <script type="module" src="renderer/app.mjs"></script>
</body>
</html>
